<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - SIMPLE MMS (Maintenance Management System)</title>
  <meta name="description" content="Halaman Masuk Sistem Pengelolaan Pemeliharaan Aset SIMPLE MMS">

  <!-- Lucide Icons & Fonts -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/main.css">

  <style>
    /* Styling khusus Login Page */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.15), transparent 40%),
                  radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.12), transparent 40%),
                  var(--bg-primary);
      position: relative;
      overflow-x: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      padding: 24px;
      z-index: 10;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-card {
      background: var(--bg-surface);
      backdrop-filter: var(--backdrop-blur);
      -webkit-backdrop-filter: var(--backdrop-blur);
      border: var(--glass-border);
      border-radius: 16px;
      padding: 36px 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }

    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 28px;
    }

    .login-logo {
      width: 54px;
      height: 54px;
      background: linear-gradient(135deg, var(--primary-color), #4f46e5);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 26px;
      margin-bottom: 12px;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-color);
      margin: 0;
      letter-spacing: -0.5px;
    }

    .login-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Role Quick Selector */
    .role-chips-section {
      margin-bottom: 22px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      padding: 10px;
      border: 1px dashed var(--border-color);
    }

    .role-chips-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .role-chips {
      display: flex;
      gap: 6px;
    }

    .role-chip {
      flex: 1;
      padding: 7px 8px;
      border-radius: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .role-chip:hover {
      background: var(--primary-light);
      border-color: var(--primary-color);
      color: var(--text-color);
    }

    .role-chip.active {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    /* Form Fields */
    .form-group-login {
      margin-bottom: 18px;
    }

    .form-group-login label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-color);
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i.prefix-icon {
      position: absolute;
      left: 12px;
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .input-wrapper input {
      width: 100%;
      padding: 11px 12px 11px 38px;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-color);
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .input-wrapper input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
    }

    .toggle-password:hover {
      color: var(--text-color);
    }

    .login-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.82rem;
      margin-bottom: 22px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .forgot-link {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 500;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .btn-login-submit {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 9px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(99, 102, 241, 0.4);
      transition: all 0.2s ease;
    }

    .btn-login-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(99, 102, 241, 0.5);
    }

    .btn-login-submit:active {
      transform: translateY(0);
    }

    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .theme-toggle-fixed {
      position: absolute;
      top: 18px;
      right: 18px;
    }
  </style>
</head>
<body>

  <!-- Theme Toggle -->
  <div class="theme-toggle-fixed">
    <button id="theme-btn" class="btn btn-icon btn-outline-secondary" onclick="toggleTheme()" title="Ubah Tema Gelap/Terang">
      <i data-lucide="sun" id="theme-icon"></i>
    </button>
  </div>

  <div class="login-container">
    <div class="login-card">
      
      <!-- Brand Header -->
      <div class="login-brand">
        <div class="login-logo">
          <i data-lucide="wrench"></i>
        </div>
        <h1 class="login-title">SIMPLE MMS</h1>
        <span class="login-subtitle">Maintenance Management System</span>
      </div>

      <!-- Demo Quick Role Selector -->
      <div class="role-chips-section">
        <div class="role-chips-title">
          <i data-lucide="sparkles" style="width: 14px; height: 14px;"></i> Pilih Akun Demo Cepat
        </div>
        <div class="role-chips">
          <button type="button" class="role-chip active" onclick="selectRole('admin', 'admin@mms.local')">
            <i data-lucide="shield-check" style="width:13px;height:13px;"></i> Admin
          </button>
          <button type="button" class="role-chip" onclick="selectRole('spv', 'supervisor@mms.local')">
            <i data-lucide="user-check" style="width:13px;height:13px;"></i> SPV
          </button>
          <button type="button" class="role-chip" onclick="selectRole('tech', 'teknisi@mms.local')">
            <i data-lucide="hard-hat" style="width:13px;height:13px;"></i> Teknisi
          </button>
        </div>
      </div>

      <!-- Form Login -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group-login">
          <label for="login-email">Email / ID Pengguna</label>
          <div class="input-wrapper">
            <i data-lucide="mail" class="prefix-icon"></i>
            <input type="email" id="login-email" placeholder="nama@perusahaan.com" value="admin@mms.local" required>
          </div>
        </div>

        <div class="form-group-login">
          <label for="login-password">Kata Sandi</label>
          <div class="input-wrapper">
            <i data-lucide="lock" class="prefix-icon"></i>
            <input type="password" id="login-password" placeholder="••••••••" value="password123" required>
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" title="Lihat Password">
              <i data-lucide="eye" id="eye-icon" style="width: 18px; height: 18px;"></i>
            </button>
          </div>
        </div>

        <div class="login-options">
          <label class="remember-me">
            <input type="checkbox" id="remember-me" checked>
            Ingat saya
          </label>
          <a href="#" class="forgot-link" onclick="alert('Silakan hubungi administrator untuk mereset kata sandi.')">Lupa sandi?</a>
        </div>

        <button type="submit" class="btn-login-submit" id="btn-submit">
          <span>Masuk ke Dashboard</span>
          <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
        </button>
      </form>

      <div class="login-footer">
        <div>Mode Standalone / Supabase Cloud Ready</div>
        <div style="opacity: 0.7; margin-top: 2px;">&copy; 2026 SIMPLE MMS &bull; All Rights Reserved</div>
      </div>

    </div>
  </div>

  <script>
    // Inisialisasi icon
    lucide.createIcons();

    // Toggle Role Demo
    function selectRole(role, email) {
      document.querySelectorAll('.role-chip').forEach(c => c.classList.remove('active'));
      event.currentTarget.classList.add('active');
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = 'password123';
    }

    // Toggle Password Visibility
    function togglePasswordVisibility() {
      const passInput = document.getElementById('login-password');
      const eyeIcon = document.getElementById('eye-icon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.setAttribute('data-lucide', 'eye-off');
      } else {
        passInput.type = 'password';
        eyeIcon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    // Toggle Dark / Light Theme
    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('mms_theme', newTheme);
      
      const themeIcon = document.getElementById('theme-icon');
      themeIcon.setAttribute('data-lucide', newTheme === 'dark' ? 'sun' : 'moon');
      lucide.createIcons();
    }

    // Load saved theme
    const savedTheme = localStorage.getItem('mms_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    const themeIcon = document.getElementById('theme-icon');
    if (themeIcon) {
      themeIcon.setAttribute('data-lucide', savedTheme === 'dark' ? 'sun' : 'moon');
    }

    // Handle Login Submit
    function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      const email = document.getElementById('login-email').value;

      btn.disabled = true;
      btn.innerHTML = '<span>Memverifikasi...</span>';

      // Simpan session dummy
      localStorage.setItem('mms_auth_user', JSON.stringify({
        email: email,
        loginAt: new Date().toISOString()
      }));

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 700);
    }
  </script>
</body>
</html>
